<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Teaming Platform</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .hidden {
            display: none;
        }

        .tab-bar button {
            padding: 10px;
            cursor: pointer;
            margin-right: 5px;
        }

        .card {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        input,
        select {
            display: block;
            margin-bottom: 10px;
            padding: 8px;
            width: 100%;
        }

        .auth-box {
            max-width: 400px;
            margin: 0 auto;
        }
    </style>
</head>

<body>

    <!-- Auth Section -->
    <div id="auth-section" class="auth-box">
        <h2>Login / Register</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">

        <div id="register-fields">
            <hr>
            <small>Only fill below if registering for the first time:</small>
            <input type="text" id="name" placeholder="Full Name">
            <select id="exp">
                <option value="5+">5-9 Years</option>
                <option value="10+">10-14 Years</option>
                <option value="15+">15-19 Years</option>
                <option value="20+">20+ Years</option>
            </select>
            <input type="text" id="city" placeholder="City">
            <select id="background">
                <option value="Tech">Tech</option>
                <option value="Non-Tech">Non-Tech</option>
            </select>
            <input type="text" id="domain" placeholder="Current Domain (e.g. Finance)">
            <input type="text" id="proj_domain" placeholder="Project Domain (e.g. Data Science)">
            <input type="text" id="proj_desc" placeholder="Project Description">
        </div>

        <button id="btn-login">Login</button>
        <button id="btn-register">Register Profile</button>
    </div>

    <!-- Main App Section -->
    <div id="app-section" class="hidden">
        <h2 id="welcome-msg"></h2>

        <div class="tab-bar">
            <button onclick="showTab('tab-recommendations')">AI Recommendations</button>
            <button onclick="showTab('tab-all')">All Members</button>
            <button onclick="showTab('tab-interests')">Interests Received</button>
            <button onclick="auth.signOut()">Logout</button>
        </div>

        <!-- Paired Alert -->
        <div id="partner-alert" class="hidden card" style="background-color: #d4edda;">
            <h3>You are teamed up!</h3>
            <div id="partner-details"></div>
        </div>

        <div id="tab-recommendations" class="tab-content hidden">
            <h3>Top AI Matches</h3>
            <button id="btn-get-reco">Find Matches</button>
            <div id="reco-results"></div>
        </div>

        <div id="tab-all" class="tab-content hidden">
            <h3>All Open Members</h3>
            <div id="all-results"></div>
        </div>

        <div id="tab-interests" class="tab-content hidden">
            <h3>Interests Received</h3>
            <div id="interests-results"></div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
        }
    </script>
</body>

</html>
